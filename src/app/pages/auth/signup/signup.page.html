<ion-content class="otp-content">
  <div class="otp-wrapper">

    <!-- Brand -->
    <div class="brand">
      <ion-icon name="bed-outline"></ion-icon>
      <h1>CottonCart</h1>
      <span class="role-pill">{{ role === 'shop' ? '🏪 Shop Owner' : '👤 Customer' }}</span>
    </div>

    <!-- Signup Card -->
    <div class="auth-card">
      <h2>Create Account</h2>
      <p class="sub">Your phone number will be your login ID</p>

      <!-- Full Name -->
      <div class="input-group">
        <ion-icon name="person-outline" class="input-icon"></ion-icon>
        <ion-input
          [(ngModel)]="name"
          placeholder="Full Name"
          type="text"
          class="flex-input">
        </ion-input>
      </div>

      <!-- Phone Number -->
      <div class="input-group">
        <span class="input-prefix">🇮🇳 +91</span>
        <ion-input
          [(ngModel)]="phone"
          placeholder="10-digit mobile number"
          type="tel"
          maxlength="10"
          inputmode="numeric"
          class="flex-input">
        </ion-input>
      </div>

      <!-- Password -->
      <div class="input-group">
        <ion-icon name="lock-closed-outline" class="input-icon"></ion-icon>
        <ion-input
          [(ngModel)]="password"
          [type]="showPassword ? 'text' : 'password'"
          placeholder="Password (min. 6 characters)"
          class="flex-input">
        </ion-input>
        <ion-icon
          [name]="showPassword ? 'eye-off-outline' : 'eye-outline'"
          class="input-icon-end"
          (click)="showPassword = !showPassword">
        </ion-icon>
      </div>

      <!-- Confirm Password -->
      <div class="input-group">
        <ion-icon name="lock-closed-outline" class="input-icon"></ion-icon>
        <ion-input
          [(ngModel)]="confirmPassword"
          [type]="showPassword ? 'text' : 'password'"
          placeholder="Confirm password"
          class="flex-input"
          (keyup.enter)="signup()">
        </ion-input>
      </div>

      <!-- Signup button -->
      <ion-button expand="block" class="primary-btn" (click)="signup()" [disabled]="loading">
        <ion-spinner *ngIf="loading" name="crescent" color="light"></ion-spinner>
        <span *ngIf="!loading">Create Account</span>
      </ion-button>

      <p class="switch-link">
        Already have an account?
        <span (click)="goToLogin()">Login</span>
      </p>
    </div>

    <p class="back-link" (click)="goBack()">← Back to role selection</p>

  </div>
</ion-content>
