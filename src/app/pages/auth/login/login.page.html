<ion-content class="otp-content">

  <!-- Invisible reCAPTCHA — Firebase needs this div in the DOM -->
  <div id="recaptcha-container"></div>

  <div class="otp-wrapper">

    <!-- Logo -->
    <div class="brand">
      <ion-icon name="bed-outline"></ion-icon>
      <h1>CottonCart</h1>
      <span class="role-pill">{{ role === 'shop' ? '🏪 Shop Owner' : '👤 Customer' }}</span>
    </div>

    <!-- ══ STEP 1: Phone Number ══════════════════════════════════════ -->
    <div class="auth-card" *ngIf="step === 1">
      <h2>Enter Mobile Number</h2>
      <p class="sub">We'll send a one-time OTP to verify your number</p>

      <div class="phone-row">
        <div class="country-chip">🇮🇳 +91</div>
        <ion-input
          type="tel"
          [(ngModel)]="phone"
          placeholder="10-digit number"
          maxlength="10"
          inputmode="numeric"
          class="phone-input"
          (keyup.enter)="sendOtp()">
        </ion-input>
      </div>

      <ion-button
        expand="block"
        class="primary-btn"
        (click)="sendOtp()"
        [disabled]="loading">
        <ion-spinner *ngIf="loading" name="crescent" color="light"></ion-spinner>
        <ng-container *ngIf="!loading">
          <ion-icon name="phone-portrait-outline" slot="start"></ion-icon>
          Send OTP
        </ng-container>
      </ion-button>

      <p class="back-link" (click)="goBack()">← Back to role selection</p>
    </div>

    <!-- ══ STEP 2: Enter OTP ═════════════════════════════════════════ -->
    <div class="auth-card" *ngIf="step === 2">

      <div class="sent-badge">
        <ion-icon name="checkmark-circle-outline" color="success"></ion-icon>
        <span>OTP sent to <strong>+91 {{ phone }}</strong></span>
      </div>

      <h2>Enter OTP</h2>
      <p class="sub">Enter the 6-digit code sent via SMS</p>

      <ion-input
        type="tel"
        [(ngModel)]="otp"
        placeholder="• • • • • •"
        maxlength="6"
        inputmode="numeric"
        class="otp-input"
        (keyup.enter)="verifyOtp()">
      </ion-input>

      <ion-button
        expand="block"
        class="primary-btn"
        (click)="verifyOtp()"
        [disabled]="loading">
        <ion-spinner *ngIf="loading" name="crescent" color="light"></ion-spinner>
        <ng-container *ngIf="!loading">
          <ion-icon name="checkmark-circle-outline" slot="start"></ion-icon>
          Verify &amp; Login
        </ng-container>
      </ion-button>

      <p class="change-number" (click)="changeNumber()">
        <ion-icon name="arrow-back-outline"></ion-icon>
        Change number / Resend OTP
      </p>
    </div>

  </div>
</ion-content>
