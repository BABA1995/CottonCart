<ion-content class="otp-content">
  <div class="otp-wrapper">

    <!-- Brand -->
    <div class="brand">
      <ion-icon name="bed-outline"></ion-icon>
      <h1>CottonCart</h1>
      <span class="role-pill">{{ role === 'shop' ? '🏪 Shop Owner' : '👤 Customer' }}</span>
    </div>

    <!-- Login Card -->
    <div class="auth-card">
      <h2>Welcome Back</h2>
      <p class="sub">Sign in with your phone number or email</p>

      <!-- Phone / Email input -->
      <div class="input-group">
        <div class="input-prefix" *ngIf="isPhone">🇮🇳 +91</div>
        <ion-icon name="phone-portrait-outline" *ngIf="!isPhone" class="input-icon"></ion-icon>
        <ion-input
          [(ngModel)]="identifier"
          [placeholder]="'Phone number or email'"
          [type]="isPhone ? 'tel' : 'text'"
          inputmode="text"
          class="flex-input"
          (keyup.enter)="login()">
        </ion-input>
      </div>

      <!-- Password input -->
      <div class="input-group">
        <ion-icon name="lock-closed-outline" class="input-icon"></ion-icon>
        <ion-input
          [(ngModel)]="password"
          [type]="showPassword ? 'text' : 'password'"
          placeholder="Password"
          class="flex-input"
          (keyup.enter)="login()">
        </ion-input>
        <ion-icon
          [name]="showPassword ? 'eye-off-outline' : 'eye-outline'"
          class="input-icon-end"
          (click)="showPassword = !showPassword">
        </ion-icon>
      </div>

      <!-- Login button -->
      <ion-button expand="block" class="primary-btn" (click)="login()" [disabled]="loading">
        <ion-spinner *ngIf="loading" name="crescent" color="light"></ion-spinner>
        <span *ngIf="!loading">Login</span>
      </ion-button>

      <!-- Signup link -->
      <p class="switch-link">
        New to CottonCart?
        <span (click)="goToSignup()">Create account</span>
      </p>
    </div>

    <p class="back-link" (click)="goBack()">← Back to role selection</p>

  </div>
</ion-content>
