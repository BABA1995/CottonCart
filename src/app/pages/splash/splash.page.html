<ion-content [fullscreen]="true" class="splash-content">

    <!-- Logo Icon -->

      <ion-icon name="bed-outline" class="logo-icon"></ion-icon>
    </div>

    <!-- App Name -->
    <h1 class="app-name">CottonCart</h1>
